name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ninguno de estos valores es secreto: los tres terminan compilados
      # dentro del JavaScript que descarga cualquiera que abra el sitio. Por
      # eso viven en src/config.js y los secretos son solo para pisarlos.
      # Este paso informa qué se usó, pero nunca corta el deploy.
      - name: Qué configuración se usa
        env:
          URL_SCRIPT: ${{ secrets.VITE_URL_SCRIPT }}
          ID_PLANILLA: ${{ secrets.VITE_ID_PLANILLA }}
          CLAVE_PANEL: ${{ secrets.VITE_CLAVE_PANEL }}
        run: |
          decir() { if [ -n "$2" ]; then echo "  $1: secreto del repo"; else echo "  $1: valor por defecto de src/config.js"; fi; }
          decir VITE_URL_SCRIPT  "$URL_SCRIPT"
          decir VITE_ID_PLANILLA "$ID_PLANILLA"
          decir VITE_CLAVE_PANEL "$CLAVE_PANEL"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_URL_SCRIPT: ${{ secrets.VITE_URL_SCRIPT }}
          VITE_ID_PLANILLA: ${{ secrets.VITE_ID_PLANILLA }}
          VITE_CLAVE_PANEL: ${{ secrets.VITE_CLAVE_PANEL }}
          VITE_CUMPLEANERO: ${{ secrets.VITE_CUMPLEANERO }}

      # Si el sitio se publicara en modo demo, cada teléfono guardaría en su
      # propio navegador y la planilla quedaría vacía toda la noche. Es lo
      # único que sí corta el deploy, y ahora se comprueba sobre el build.
      - name: Comprobar que no quedó en modo demo
        run: |
          if grep -rq 'script.google.com/macros' dist/assets/*.js; then
            echo "  OK: el build apunta al Apps Script."
          else
            echo "::error::El build no tiene la URL del Apps Script. Se publicaría en modo demo y no guardaría nada en la planilla."
            exit 1
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
